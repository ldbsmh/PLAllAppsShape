plugins {
    id 'com.android.application'
}

android {
    namespace 'com.plallappsshape'
    compileSdk 36

    defaultConfig {
        applicationId 'com.plallappsshape'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        buildConfig false
    }

    testOptions {
        unitTests {
            // owners / resources live in android.jar at test time: return defaults instead of throwing
            returnDefaultValues = true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // An unsigned release apk cannot be installed; sign with the debug key so CI artefacts
            // (and local release builds) install on the device.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

// The unit tests exercise only the framework-free core. Their launcher doubles are hand written
// (app/src/test/java/com/android/...). The stub android.jar exports every package, so it must not
// be on the test runtime classpath: only the system framework jar (never part of unit tests).
tasks.withType(Test).configureEach {
    useJUnit()
    doFirst {
        classpath = files(
                sourceSets.test.output.classesDirs,
                layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes'),
                configurations.testRuntimeClasspath
        )
    }
}

dependencies {
    // Xposed API: de.robv.android.xposed:api:82 is no longer on Maven Central, tools/build_xposed_api.py
    // generates it (bootstrap.sh runs that first). Provided by the framework at runtime anyway.
    compileOnly files("${rootProject.buildDir}/xposed-api.jar")

    testImplementation 'junit:junit:4.13.2'
}
