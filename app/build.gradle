plugins {
    id 'com.android.application'
}

android {
    namespace 'com.plallappsshape'
    compileSdk 36

    defaultConfig {
        applicationId 'com.plallappsshape'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        buildConfig false
    }

    // Ship both module entry descriptions: assets/xposed_init (classic Xposed API, used by the
    // Xposed manager / older LSPosed) and META-INF/xposed/*.list (LSPosed >= 93). The library
    // resources are packaged as-is; nothing else uses java resources in this module.
    sourceSets {
        main {
            resources {
                srcDirs 'src/main/resources'
            }
        }
    }

    testOptions {
        unitTests {
            // owners / resources live in android.jar at test time: return defaults instead of throwing
            returnDefaultValues = true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // An unsigned release apk cannot be installed; sign with the debug key so CI artefacts
            // (and local release builds) install on the device.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.all { t ->
            // The framework-free core is covered by ./verify_tests.sh (plain JVM, no stubs on the
            // runtime classpath). AGP runs unit tests against a stub android.jar whose packages
            // shadow the hand-written launcher doubles, so failures there must not block the APK.
            t.ignoreFailures = true
            t.testLogging {
                events 'passed', 'failed', 'skipped'
                exceptionFormat 'full'
            }
        }
    }
}

dependencies {
    // Xposed API: de.robv.android.xposed:api:82 is no longer on Maven Central, tools/build_xposed_api.py
    // generates it (bootstrap.sh runs that first). Provided by the framework at runtime anyway.
    compileOnly files("${rootProject.buildDir}/xposed-api.jar")

    testImplementation 'junit:junit:4.13.2'
}
