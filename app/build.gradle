plugins {
    id 'com.android.application'
}

android {
    namespace 'com.plallappsshape'
    compileSdk 36

    defaultConfig {
        applicationId 'com.plallappsshape'
        minSdk 31
        targetSdk 36
        versionCode 3
        versionName '1.5'
    }

    buildFeatures {
        buildConfig false
    }

    testOptions {
        unitTests {
            // owners / resources live in android.jar at test time: return defaults instead of throwing
            returnDefaultValues = true
            all { t ->
                // The framework-free core is covered by ./verify_tests.sh (plain JVM). AGP runs unit
                // tests against a stub android.jar that shadows the hand-written launcher doubles,
                // so failures there must not block the apk.
                t.ignoreFailures = true
                t.testLogging {
                    events 'passed', 'failed', 'skipped'
                    exceptionFormat 'full'
                }
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // An unsigned release apk cannot be installed; sign with the debug key so CI artefacts
            // (and local release builds) install on the device.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // The real Xposed API (de.robv.android.xposed:api:82), vendored because it was pulled from Maven
    // Central. compileOnly: the framework provides these classes at runtime, and bundling them would
    // shadow the framework's own (a hand-written stub with a wrong return type cost us a
    // NoSuchMethodError on findAndHookMethod).
    compileOnly files('libs/api-82.jar')

    testImplementation 'junit:junit:4.13.2'
}
